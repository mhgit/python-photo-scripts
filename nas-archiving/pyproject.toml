[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nas-archiving"
version = "0.1.0"
description = "Create tar archives of photo stores for Glacier or similar; validates and produces MD5."
readme = "README.md"
requires-python = ">=3.14.0"
dependencies = []

[project.scripts]
nas-archiving = "nas_archiving.__main__:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ruff>=0.14.14",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]  # pycodestyle errors, pyflakes, isort, pyupgrade
