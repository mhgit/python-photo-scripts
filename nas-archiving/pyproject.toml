[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nas-archiving"
version = "0.1.0"
description = "Create tar archives of photo stores for Glacier or similar; validates and produces MD5."
readme = "README.md"
requires-python = ">=3.14.0"
dependencies = []

[project.scripts]
nas-archiving = "nas_archiving.__main__:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest-cov>=6.0.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --cov=nas_archiving --cov-report=term-missing"

[tool.ruff]
target-version = "py314"
line-length = 120
# Avoid traversing test-files (contains symlinks that can cause ELOOP in CI)
exclude = ["test-files"]

[tool.ruff.lint]
# pycodestyle errors, pyflakes, isort, pyupgrade, bugbear, flake8-simplify
select = ["E", "F", "I", "UP", "B", "SIM"]
